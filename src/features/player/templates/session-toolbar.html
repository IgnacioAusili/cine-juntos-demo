            <section class="session-toolbar" aria-label="Controles de sala">
              <div class="session-toolbar__body">
                <div class="session-toolbar__field">
                  <span class="session-toolbar__label-row">
                    <span class="session-toolbar__label">Enlace del video</span>
                  </span>
                  <div class="session-toolbar__input-shell">
                    <input
                      id="videoUrlInput"
                      type="search"
                      inputmode="url"
                      autocomplete="off"
                      spellcheck="false"
                      data-bwignore="true"
                      data-lpignore="true"
                      placeholder="https://servidor.com/video.mp4"
                    />
                    <button
                      id="videoHostingHelpButton"
                      class="video-hosting-help-button"
                      type="button"
                      aria-label="Cómo alojar y compartir un video"
                      aria-haspopup="dialog"
                      aria-controls="videoHostingDialog"
                      title="Cómo alojar y compartir un video"
                    >
                      <span data-lucide="circle-help" aria-hidden="true"></span>
                    </button>
                  </div>
                </div>
                <button
                  class="button   button--primary"
                  id="loadVideoButton"
                  type="button"
                  title="Cargar el video en la sala"
                  data-tooltip="Cargar el video en la sala"
                >
                  <span data-lucide="play-square"></span>
                  <span class="button__label">Cargar</span>
                  <span class="button__spinner" aria-hidden="true"></span>
                </button>
              </div>
            </section>
